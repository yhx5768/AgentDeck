# cc-webui 配置
# 也可以用环境变量 GATEWAY_TOKEN 覆盖 gateway_token

listen: "0.0.0.0:8321"

# 简单鉴权 token（OpenClaw 风格）。为空则启动时随机生成并打印到控制台。
gateway_token: "change-me-to-a-long-random-string"

# 会话数据（db.json + 事件流）存放目录
data_dir: "./data"

# 新建会话时的默认工作目录
default_cwd: "~"

# 三层结构：
#   clis[]      - 一个聊天 CLI 二进制安装（path + args + 权限模式 + 共享 env）
#                 kind: claude（缺省）= Claude Code 及兼容 CLI（stream-json 协议）
#                 kind: opencode = opencode 引擎（run --format json 协议）
#   providers[] - 一个模型后端（kind: claude 的共享 env 是 BASE_URL/TOKEN；
#                 kind: opencode 的 provider 名必须等于 opencode CLI 的
#                 providerID，凭据走 opencode 自己的 auth.json，env 不生效）
#   providers[].models[] - 该后端可选的模型（每个模型可带自己的 env）
# 生效 env：cli.env → provider.env → model.env（后者覆盖前者）
# 会话的引擎 = 其 cli 的 kind；创建/修改/导入时 cli 与 provider 的 kind 必须一致。
clis:
  - name: "official-claude"
    path: "claude"
    permission_mode: "bypassPermissions"
    # partial_messages: true 开启 --include-partial-messages，前端打字机式
    # 逐 token 流式渲染。仅新版 Claude Code 支持；兼容 CLI 请勿开启。
    partial_messages: true
    args: []
    env: {}

  - name: "ducc"
    path: "/home/you/.baidu-cc/baidu-cc/bin/ducc"
    permission_mode: "bypassPermissions"
    args: []
    env: {}

  - name: "opencode"
    kind: "opencode"              # opencode 引擎；permission_mode 映射为 --auto
    path: "/home/you/.opencode/bin/opencode"
    permission_mode: "bypassPermissions"
    args: []
    env: {}

providers:
  - name: "anthropic"
    env: {}                  # 用官方端点时无需额外 env
    models:
      - name: "claude-sonnet-4-5"
        input: [text, image] # 声明的输入能力：文本 + 图片
      - name: "claude-opus-4-1"
        input: [text, image]

  - name: "kimi"
    env:                     # kimi provider 下的所有模型共享这些 env
      ANTHROPIC_BASE_URL: "http://127.0.0.1:3456"
      ANTHROPIC_AUTH_TOKEN: "..."
    models:
      - name: "kimi-k3"
        input: [text, image] # 仅该模型声明的 input（覆盖 provider 缺省值）
      - name: "kimi-k2.7"
        env:                 # 仅该模型额外的 env（覆盖 provider 级同名项）
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "1000000"
      - name: "kimi-k2.7"
        env:
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "500000"

  - name: "minimax"
    env:
      ANTHROPIC_BASE_URL: "https://api.minimaxi.com/anthropic"
      ANTHROPIC_AUTH_TOKEN: "sk-..."
    models:
      - name: "MiniMax-M3[1m]"

  # opencode 引擎镜像示例：provider 名必须等于 opencode CLI 的 providerID
  # （`opencode models` 可查全量），model 名 = modelID，运行时拼成
  # `opencode run -m <provider>/<model>`。env 置空——凭据在 opencode 自己的
  # auth.json。本组 provider 只能配 kind: opencode 的 cli，勿与 claude/ducc
  # 混选（env 为空会直连官方端点报模型未知）。
  - name: "kimi-for-coding"
    kind: "opencode"
    env: {}
    models:
      - name: "k3"
      - name: "k3-256k"

  - name: "sensenova"                # 商汤日日新（SenseNova），见 https://platform.sensenova.cn/docs
    env:
      # Anthropic Messages 兼容端点。API Key 在 https://platform.sensenova.cn/console/keys 申请（sk- 开头）。
      # 付费模型（SenseChat-5 等）走 api.sensenova.cn/compatible-mode/v2，仅 OpenAI
      # 兼容格式，无法直连本 provider。
      ANTHROPIC_BASE_URL: "https://token.sensenova.cn/v1/messages"
      ANTHROPIC_AUTH_TOKEN: "sk-..."      # 替换为你的 SenseNova API Key
      API_TIMEOUT_MS: "3000000"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      ENABLE_TOOL_SEARCH: "true"
      CLAUDE_CODE_DISABLE_NONSTREAMING_FALLBACK: "1"
    models:
      - name: "sensenova-6.8-flash-lite"
        input: [text, image]        # 多模态；256K 上下文（实际上限 262144）
        env:                        # 选中的模型名要写进 ANTHROPIC_MODEL 系列别名
          ANTHROPIC_MODEL: "sensenova-6.8-flash-lite"
          ANTHROPIC_SMALL_FAST_MODEL: "sensenova-6.8-flash-lite"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "sensenova-6.8-flash-lite"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "sensenova-6.8-flash-lite"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "sensenova-6.8-flash-lite"
          CLAUDE_CODE_SUBAGENT_MODEL: "sensenova-6.8-flash-lite"
          ANTHROPIC_REASONING_MODEL: "sensenova-6.8-flash-lite"
          CLAUDE_AUTOCOMPACT_PCT_OVERRIDE: "75"
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "210000"
          CLAUDE_CODE_MAX_CONTEXT_TOKENS: "262144"
          CLAUDE_CODE_EFFORT_LEVEL: "max"
          CLAUDE_CODE_HARBOR_KITE: "1"
      - name: "deepseek-v4-pro"
        input: [text]               # 纯文本；1M 上下文
        env:
          ANTHROPIC_MODEL: "deepseek-v4-pro"
          ANTHROPIC_SMALL_FAST_MODEL: "deepseek-v4-pro"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "deepseek-v4-pro"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "deepseek-v4-pro"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "deepseek-v4-pro"
          CLAUDE_CODE_SUBAGENT_MODEL: "deepseek-v4-pro"
          ANTHROPIC_REASONING_MODEL: "deepseek-v4-pro"
          CLAUDE_AUTOCOMPACT_PCT_OVERRIDE: "75"
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "800000"
          CLAUDE_CODE_MAX_CONTEXT_TOKENS: "1048576"
          CLAUDE_CODE_EFFORT_LEVEL: "max"
          CLAUDE_CODE_HARBOR_KITE: "1"
      - name: "glm-5.2"
        input: [text]               # 纯文本；1M 上下文，max output 128K
        env:
          ANTHROPIC_MODEL: "glm-5.2"
          ANTHROPIC_SMALL_FAST_MODEL: "glm-5.2"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "glm-5.2"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "glm-5.2"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "glm-5.2"
          CLAUDE_CODE_SUBAGENT_MODEL: "glm-5.2"
          ANTHROPIC_REASONING_MODEL: "glm-5.2"
          CLAUDE_AUTOCOMPACT_PCT_OVERRIDE: "75"
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "800000"
          CLAUDE_CODE_MAX_CONTEXT_TOKENS: "1000000"
          CLAUDE_CODE_EFFORT_LEVEL: "max"
          CLAUDE_CODE_HARBOR_KITE: "1"
      # sensenova-u1-fast / sensenova-u1.5-lite：信息图生成专用（输出为 image，
      # 不走 chat completions），无法用于对话，不列入。