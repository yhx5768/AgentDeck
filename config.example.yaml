# AgentDeck 配置（内部标识仍为 cc-webui）
# 也可以用环境变量 GATEWAY_TOKEN 覆盖 gateway_token

listen: "0.0.0.0:8321"

# 简单鉴权 token（OpenClaw 风格）。为空则启动时随机生成并打印到控制台。
gateway_token: "change-me-to-a-long-random-string"

# 会话数据（db.json + 事件流）存放目录
data_dir: "./data"

# 新建会话时的默认工作目录
default_cwd: "~"

# 每一轮都往 system prompt 追加一段「本界面能把整页 HTML 渲染成活的页面」的
# 提示词（文本在 internal/runner/htmlhint.go），让模型把图表/仪表盘直接输出成
# ```html 围栏而不是写成文件丢给用户自己开。
# 注释掉 = 开（默认）。设 false 才关闭。
# 覆盖范围：
#   claude / qoder / mcode —— 走 --append-system-prompt 追加进每轮 system prompt。
#   codex / ducx —— 没有 append 语义的入口，改走 -c instructions=<TOML 字符串>；
#     它是一条独立的 developer 消息，每次运行都从 config 重读，resume 也生效。
#     注意任何 -c 都会让 ducx 不再注入自己的 provider，所以传 hint 时会一并补
#     -c model_provider=<clis[].model_provider>。用户在 clis[].args 里自己写了
#     同名 flag 时不重复注入（CLIs 取最后一个）。
#   opencode —— 它没有 append 语义的入口（system 字段是覆盖 agent 自身 prompt
#     的，填进去更糟），改写 ~/.config/cc-webui/opencode/ 下的 opencode.json，
#     只放一个 instructions 键指向约定正文，并在 opencode serve 启动前把
#     OPENCODE_CONFIG_DIR 指过去。opencode 的配置是合并的，provider / mcp /
#     theme 照常生效；而你在终端里跑的 opencode 和 TUI 读不到这份约定。
# 设 false 时完全不碰上面那个用户文件（既不创建也不更新）。
# html_render_hint: false

# 三层结构：
#   clis[]      - 一个聊天 CLI 二进制安装（path + args + 权限模式 + 共享 env）
#                 kind: claude（缺省）= Claude Code 及兼容 CLI（stream-json 协议）
#                 kind: opencode = opencode 引擎（run --format json 协议）
#                 kind: mcode = MiniMax Code 引擎（exec --output-format
#                 stream-json 协议，事件形状与前两者都不同，见 AGENTS.md §8）
#                 kind: qoder = Qoder CLI CN 引擎（Claude Code 的 fork，协议同
#                 claude，只是没有 --verbose、档位 flag 叫 --reasoning-effort、
#                 permission_mode 用下划线拼写，transcript 在 ~/.qoder-cn）
#                 kind: codex = Codex CLI 引擎（`codex exec --json` +
#                 $CODEX_HOME/sessions rollout；Baidu 的 ducx 是同一协议，
#                 用 home 指向 ~/.baidu-cx、model_provider 指向 oneapi）
#   providers[] - 一个模型后端（kind: claude 的共享 env 是 BASE_URL/TOKEN；
#                 kind: opencode 的 provider 名必须等于 opencode CLI 的
#                 providerID，凭据走 opencode 自己的 auth.json，env 不生效；
#                 kind: mcode 的凭据走 mcode 自己的登录态，env 同样不生效；
#                 kind: qoder 的凭据走 `qoderclicn login` 的登录态，env 不生效）
#   providers[].models[] - 该后端可选的模型（每个模型可带自己的 env）。
#                 kind: opencode / mcode / qoder 的这一层可以留空：可用模型是
#                 动态的，前端下拉由服务端读 CLI 自己那份清单（opencode 跑
#                 `opencode models <provider> --verbose` 经 /api/opencode-models；
#                 mcode 读 ~/.minimax/config.yaml 经 /api/mcode-models；qoder 跑
#                 `qoderclicn --list-models` 经 /api/qoder-models），
#                 写死在这里只会过期。
# 生效 env：cli.env → provider.env → model.env（后者覆盖前者）
# 会话的引擎 = 其 cli 的 kind；创建/修改/导入时 cli 与 provider 的 kind 必须一致。
clis:
  - name: "official-claude"
    path: "claude"
    permission_mode: "default"   # 默认走 Web 审批卡；选 bypassPermissions 才全放行
    # partial_messages: true 开启 --include-partial-messages，前端打字机式
    # 逐 token 流式渲染。仅新版 Claude Code 支持；兼容 CLI 请勿开启。
    partial_messages: true
    args: []
    env: {}

  - name: "ducc"
    path: "/home/you/.baidu-cc/baidu-cc/bin/ducc"
    # 模型清单从 CLI 自己的命令读取（`ducc models` → "Available Models: A, B, C"）。
    # 网关模型随账号/CLI 升级变化，config 里的 models 写死会过期；provider 的
    # models 只留作输入模态提示。留空则退回静态 models。
    models_command: ["models"]
    permission_mode: "default"   # 默认走 Web 审批卡；选 bypassPermissions 才全放行
    args: []
    env: {}

  - name: "opencode"
    kind: "opencode"              # opencode 引擎；permission_mode 映射为会话 permission
                                   # ruleset：bypassPermissions → 全 allow，其余模式
                                   # 不钉规则（走 opencode 默认的 ask，前端弹审批卡）
    path: "/home/you/.opencode/bin/opencode"
    permission_mode: "bypassPermissions"
    # opencode 有 v1 / v2 两代协议（v2 是破坏性的 server API 重写，安装器会覆盖
    # 同一个路径）。默认 auto：跑 `<path> --version` 自动识别（1.x → v1，
    # 2.x → v2）。识别结果按二进制 mtime 缓存，升级后无需重启。可显式指定：
    #   opencode_api: auto | v1 | v2
    # 目前 v2 已接入回放 / 导入 / 会话列表 / 模型目录；v2 的实况对话尚未接入
    # （发消息会报错，可临时设 v1 或换回 v1 二进制）。
    opencode_api: "auto"
    args: []
    env: {}

  - name: "mcode"
    kind: "mcode"                 # MiniMax Code 引擎；permission_mode 只映射两种：
                                   # bypassPermissions → --permission full，
                                   # 其余一律 --permission smart（mcode 的 ask
                                   # 需要交互式批准，headless 下无人应答）
    path: "mcode"                 # `mcode login` 过的凭据，无需额外 env
    permission_mode: "bypassPermissions"
    args: []
    env: {}

  - name: "qoder"
    kind: "qoder"                 # Qoder CLI CN（Claude Code 的 fork）
    path: "qoderclicn"            # 官方安装脚本装到 ~/.local/bin/qoderclicn
                                   # 凭据走 `qoderclicn login` 的登录态，无需 env
    permission_mode: "default"   # 内部转成 --permission-mode default；bypassPermissions 才全放行（→ bypass_permissions）
    args: []
    env: {}

  - name: "codex"
    kind: "codex"                 # Codex CLI；`codex exec --json` 一次性进程
    path: "codex"                 # 原生 codex 的 CODEX_HOME 默认 ~/.codex
    permission_mode: "bypassPermissions"  # default → --sandbox workspace-write；
                                   # bypassPermissions → 完全跳过沙箱与审批
    args: []
    env: {}

  - name: "ducx"
    kind: "codex"                 # 百度二次封装（ducx = baidu-codex 的软链）
    path: "/home/you/.baidu-cx/baidu-cx/bin/ducx"
    home: "~/.baidu-cx"           # ducx 忽略 CODEX_HOME，rollout 固定写这里
    model_provider: "oneapi"      # 只要传 -c（例如档位），必须同时钉住 provider，
                                   # 否则 ducx 会退回 api.openai.com
    permission_mode: "bypassPermissions"
    args: []
    env: {}

providers:
  - name: "anthropic"
    env: {}                  # 用官方端点时无需额外 env
    models:
      - name: "claude-sonnet-4-5"
        input: [text, image] # 声明的输入能力：文本 + 图片
      - name: "claude-opus-4-1"
        input: [text, image]

  - name: "kimi"
    env:                     # kimi provider 下的所有模型共享这些 env
      ANTHROPIC_BASE_URL: "http://127.0.0.1:3456"
      ANTHROPIC_AUTH_TOKEN: "..."
    models:
      - name: "kimi-k3"
        input: [text, image] # 仅该模型声明的 input（覆盖 provider 缺省值）
      - name: "kimi-k2.7"
        env:                 # 仅该模型额外的 env（覆盖 provider 级同名项）
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "1000000"
      - name: "kimi-k2.7"
        env:
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "500000"

  - name: "minimax"
    env:
      ANTHROPIC_BASE_URL: "https://api.minimaxi.com/anthropic"
      ANTHROPIC_AUTH_TOKEN: "sk-..."
    models:
      - name: "MiniMax-M3[1m]"

  # opencode 引擎示例：provider 名必须等于 opencode CLI 的 providerID
  # （`opencode models` 可查全量）。env 置空——凭据在 opencode 自己的
  # auth.json。本组 provider 只能配 kind: opencode 的 cli，勿与 claude/ducc
  # 混选（env 为空会直连官方端点报模型未知）。
  #
  # models 留空：可用模型由 opencode 的注册表决定，服务端跑
  # `opencode models <provider> --verbose` 读出来经 /api/opencode-models 下发，
  # 写死只会过期（模型上下线、套餐变化都由上游决定）。留空不是"没有模型"：
  # 模型校验改查那份目录，新会话默认用清单里的第一个。
  # 想手工确认当前清单：`opencode models <provider> --refresh`。
  - name: "kimi-for-coding"
    kind: "opencode"
    env: {}
    models: []

  # mcode 引擎示例：provider 名只需在 cc-webui 内唯一，不必等于 mcode 自己的
  # provider id（后者由服务端从 mcode 配置里解析，模型下拉会自动带上
  # "minimax/" 这样的前缀）。models 留空即可——前端下拉会从 mcode 自己的配置
  # 动态读取（含每个模型的推理档位与输入模态），写死才不会随它更新而过期；
  # 留空时新会话用 mcode 自己的 defaultModel。
  - name: "mcode-minimax"
    kind: "mcode"
    env: {}                       # 凭据来自 `mcode login`，config 的 env 不参与
    models: []

  # qoder 引擎示例：provider 名只需在 cc-webui 内唯一。凭据来自 `qoderclicn
  # login`，config 的 env 不参与。models 留空即可——前端下拉由服务端跑
  # `qoderclicn --list-models` 动态读取（连同推理档位一起），写死不会随账号
  # 套餐或 CLI 升级而更新。
  # 注意：可用模型是分档的。实测 Qwen3.8-Flash 免费（响应里 billable:false），
  # 而 Qwen3.8-Max 走积分计费，额度用尽会直接报 "Your personal Credits have
  # been exhausted"。想要一个不花钱的会话，就把模型选成 Flash。
  - name: "qoder-cn"
    kind: "qoder"
    env: {}
    models: []

  # codex 引擎示例：provider 名只需在 cc-webui 内唯一；凭据由 codex 自己的
  # config.toml / 登录态决定，config 的 env 不参与。models 留空即可——可用
  # 模型与每个模型的推理档位由 CLI 侧目录提供（/api/codex-models）：原生
  # codex 读 `debug models --bundled`；ducx 这类 wrapper 读它自己的
  # <home>/model-catalogs/<model_provider>-models.json（即 `ducx models`
  # 打印的网关模型清单）。写死会随 CLI 升级/账号档位过期。
  - name: "codex"
    kind: "codex"
    env: {}
    models: []

  - name: "sensenova"                # 商汤日日新（SenseNova），见 https://platform.sensenova.cn/docs
    env:
      # Anthropic Messages 兼容端点。BASE_URL 只写到主机根、不带 /v1/messages——
      # Claude Code 会自己追加 /v1/messages：实测 token.sensenova.cn/messages 是 404，
      # 写成 .../v1 会变成 /v1/v1/messages 也 404，只有 /v1/messages 返回 200。
      # API Key 在 https://platform.sensenova.cn/console/keys 申请（sk- 开头）。
      # 付费模型（SenseChat-5 等）走 api.sensenova.cn/compatible-mode/v2，仅 OpenAI
      # 兼容格式，无法直连本 provider。
      # 本组模型的权威清单自查（全量 9 个、均免费；注意目录里的模型不一定在当前
      # token 套餐内，请求会 403 permission_error）：
      #   curl -H "Authorization: Bearer <key>" https://token.sensenova.cn/v1/models
      ANTHROPIC_BASE_URL: "https://token.sensenova.cn"
      ANTHROPIC_AUTH_TOKEN: "sk-..."      # 替换为你的 SenseNova API Key
      API_TIMEOUT_MS: "3000000"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      ENABLE_TOOL_SEARCH: "true"
      CLAUDE_CODE_DISABLE_NONSTREAMING_FALLBACK: "1"
    models:
      - name: "sensenova-6.8-flash-lite"
        input: [text, image]        # 多模态；256K 上下文（实际上限 262144）
        env:                        # 选中的模型名要写进 ANTHROPIC_MODEL 系列别名
          ANTHROPIC_MODEL: "sensenova-6.8-flash-lite"
          ANTHROPIC_SMALL_FAST_MODEL: "sensenova-6.8-flash-lite"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "sensenova-6.8-flash-lite"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "sensenova-6.8-flash-lite"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "sensenova-6.8-flash-lite"
          CLAUDE_CODE_SUBAGENT_MODEL: "sensenova-6.8-flash-lite"
          ANTHROPIC_REASONING_MODEL: "sensenova-6.8-flash-lite"
          CLAUDE_AUTOCOMPACT_PCT_OVERRIDE: "75"
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "210000"
          CLAUDE_CODE_MAX_CONTEXT_TOKENS: "262144"
          CLAUDE_CODE_EFFORT_LEVEL: "max"
          CLAUDE_CODE_HARBOR_KITE: "1"
      - name: "deepseek-v4-pro"
        input: [text]               # 纯文本；1M 上下文
        env:
          ANTHROPIC_MODEL: "deepseek-v4-pro"
          ANTHROPIC_SMALL_FAST_MODEL: "deepseek-v4-pro"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "deepseek-v4-pro"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "deepseek-v4-pro"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "deepseek-v4-pro"
          CLAUDE_CODE_SUBAGENT_MODEL: "deepseek-v4-pro"
          ANTHROPIC_REASONING_MODEL: "deepseek-v4-pro"
          CLAUDE_AUTOCOMPACT_PCT_OVERRIDE: "75"
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "800000"
          CLAUDE_CODE_MAX_CONTEXT_TOKENS: "1048576"
          CLAUDE_CODE_EFFORT_LEVEL: "max"
          CLAUDE_CODE_HARBOR_KITE: "1"
      - name: "glm-5.2"
        input: [text]               # 纯文本；1M 上下文，max output 128K
        env:
          ANTHROPIC_MODEL: "glm-5.2"
          ANTHROPIC_SMALL_FAST_MODEL: "glm-5.2"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "glm-5.2"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "glm-5.2"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "glm-5.2"
          CLAUDE_CODE_SUBAGENT_MODEL: "glm-5.2"
          ANTHROPIC_REASONING_MODEL: "glm-5.2"
          CLAUDE_AUTOCOMPACT_PCT_OVERRIDE: "75"
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "800000"
          CLAUDE_CODE_MAX_CONTEXT_TOKENS: "1000000"
          CLAUDE_CODE_EFFORT_LEVEL: "max"
          CLAUDE_CODE_HARBOR_KITE: "1"
      - name: "deepseek-v4-flash"
        input: [text]               # 纯文本；1M 上下文；2026-09-17 实测对话可用
        env:
          ANTHROPIC_MODEL: "deepseek-v4-flash"
          ANTHROPIC_SMALL_FAST_MODEL: "deepseek-v4-flash"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "deepseek-v4-flash"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "deepseek-v4-flash"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "deepseek-v4-flash"
          CLAUDE_CODE_SUBAGENT_MODEL: "deepseek-v4-flash"
          ANTHROPIC_REASONING_MODEL: "deepseek-v4-flash"
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "800000"
      - name: "deepseek-flash"
        input: [text]               # 纯文本；1M 上下文；2026-09-17 实测对话可用。
                                    # 目录 input_modalities 只声明 text——视觉是单独
                                    # 命名的变体（如 -vision-exp 后缀），故不标 image；
                                    # 视觉探针当时被套餐 TPM 429 挡住，未验成
        env:
          ANTHROPIC_MODEL: "deepseek-flash"
          ANTHROPIC_SMALL_FAST_MODEL: "deepseek-flash"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "deepseek-flash"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "deepseek-flash"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "deepseek-flash"
          CLAUDE_CODE_SUBAGENT_MODEL: "deepseek-flash"
          ANTHROPIC_REASONING_MODEL: "deepseek-flash"
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "800000"
      - name: "kimi-k3"
        input: [text]               # 纯文本；1M 上下文
        env:
          ANTHROPIC_MODEL: "kimi-k3"
          ANTHROPIC_SMALL_FAST_MODEL: "kimi-k3"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "kimi-k3"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "kimi-k3"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "kimi-k3"
          CLAUDE_CODE_SUBAGENT_MODEL: "kimi-k3"
          ANTHROPIC_REASONING_MODEL: "kimi-k3"
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "800000"
      # deepseek-v4.1-flash：2026-09-17 在 /v1/models 目录里（1M 上下文、免费），
      # 但实测请求稳定返回 403 permission_error "model is not available in the
      # current token plan"——目录有 ≠ 当前套餐能用。换套餐后取消注释，env 块同
      # 上面任一条 deepseek-*，把模型名替换即可
      # - name: "deepseek-v4.1-flash"
      #   input: [text]
      # sensenova-u1-fast / sensenova-u1.5-lite：信息图生成专用（输出为 image，
      # 不走 chat completions），无法用于对话，不列入。