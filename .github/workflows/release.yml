# Tag-triggered release. Push a tag like `v0.1.0` (or run this workflow with an
# existing tag) and it builds a self-contained binary for every supported host,
# then creates a GitHub Release with the binaries, config.example.yaml, and a
# checksums file attached.
#
# Release notes come from the annotated tag message when present; lightweight
# tags or empty messages fall back to GitHub's generated notes.
#
# Targets are Linux + macOS (amd64/arm64) only: the runner manages subprocess
# groups with syscall.Setpgid / syscall.Kill, which are Unix-only — a Windows
# host build would need platform-specific process code that doesn't exist yet.
# Cross-compilation is otherwise trivial (the web frontend is //go:embed all:web
# and there are no cgo/sqlite deps, only gopkg.in/yaml.v3), so CGO_ENABLED=0
# produces static binaries on every target here.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist on the remote)'
        required: true

permissions:
  contents: write  # create release + upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release tag
        id: tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # refs/tags/v0.1.0 -> v0.1.0
            echo "tag=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaries (linux + darwin, amd64 + arm64)
        env:
          VERSION: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p dist
          build() {
            local goos="$1" goarch="$2"
            local out="dist/cc-webui-${goos}-${goarch}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$out" .
            echo "built $out"
          }
          for goos in linux darwin; do
            for goarch in amd64 arm64; do
              build "$goos" "$goarch"
            done
          done

      - name: Stage release assets
        run: |
          cp config.example.yaml dist/
          (cd dist && sha256sum cc-webui-* config.example.yaml > checksums.txt)
          ls -la dist

      - name: Resolve release notes
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Annotated tag messages are the source of truth for release notes.
          # Lightweight tags (or empty messages) fall back to --generate-notes.
          git fetch --force --tags origin --quiet || true
          body="$(git tag -l --format='%(contents)' "$TAG")"
          # Drop a leading line that just repeats the tag name, then trim leading
          # blank lines so the Markdown body starts at the first heading/bullet.
          body="$(printf '%s\n' "$body" | awk -v tag="$TAG" 'NR == 1 && $0 == tag { next } { print }')"
          body="$(printf '%s\n' "$body" | sed '/./,$!d')"
          if printf '%s' "$body" | grep -q '[^[:space:]]'; then
            notes="$RUNNER_TEMP/release-notes.md"
            printf '%s\n' "$body" > "$notes"
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
            echo "notes_file=$notes" >> "$GITHUB_OUTPUT"
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release & upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          HAVE_NOTES: ${{ steps.notes.outputs.have_notes }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running on an existing tag (e.g. a fixed build): refresh the body
            # when the tag carries notes, then clobber assets.
            if [ "$HAVE_NOTES" = "true" ]; then
              gh release edit "$TAG" --notes-file "$NOTES_FILE"
            fi
            gh release upload "$TAG" dist/cc-webui-* dist/config.example.yaml dist/checksums.txt --clobber
          elif [ "$HAVE_NOTES" = "true" ]; then
            gh release create "$TAG" \
              dist/cc-webui-* dist/config.example.yaml dist/checksums.txt \
              --title "$TAG" \
              --notes-file "$NOTES_FILE" \
              --verify-tag
          else
            # No annotated tag message: keep the previous behavior.
            gh release create "$TAG" \
              dist/cc-webui-* dist/config.example.yaml dist/checksums.txt \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
